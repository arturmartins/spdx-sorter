[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spdx-sorter"
version = "0.1.0"
description = "Deterministically canonicalize SPDX JSON for meaningful diffs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Artur Martins" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
validation = ["spdx-tools>=0.8.5,<0.9"]

[project.scripts]
spdx-sort = "spdx_sorter.cli:main"

[project.urls]
Homepage = "https://github.com/arturmartins/spdx-sorter"
Source = "https://github.com/arturmartins/spdx-sorter"
Issues = "https://github.com/arturmartins/spdx-sorter/issues"
Changelog = "https://github.com/arturmartins/spdx-sorter/releases"
Documentation = "https://github.com/arturmartins/spdx-sorter#readme"

[dependency-groups]
test = [
  "hypothesis>=6.100,<7",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "tomli>=2,<3; python_version < '3.11'",
]
lint = ["ruff>=0.12,<1"]
type = ["mypy>=1.17,<2"]
coverage = ["coverage[toml]>=7.6,<8"]
build = ["build>=1.3,<2", "hatchling==1.27.0", "twine>=6,<7"]
release = ["sigstore>=3,<5", "twine>=6,<7"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["spdx_sorter"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/test_package_cli.py" = ["S603"]
"tests/test_packaging.py" = ["S603"]
"tests/test_validation.py" = ["S603"]

[tool.mypy]
files = ["src/spdx_sorter"]
python_version = "3.10"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/spdx_sorter"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/spdx_sorter",
  "/tests",
]
